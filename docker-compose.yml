# Local development database: MongoDB with Atlas Search + Vector Search (same features as Atlas).
#   docker compose up -d mongo
#   MONGODB_URI=mongodb://localhost:27017/?directConnection=true
services:
  mongo:
    image: mongodb/mongodb-atlas-local:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    restart: unless-stopped

volumes:
  mongo-data:
  mongo-config:
